
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zmanim Pro - Digital Dashboard</title>
    
    <!-- Librairies via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Heebo', sans-serif;
            overflow: hidden;
            margin: 0;
            height: 100vh;
        }
        .digital-font {
            font-family: 'JetBrains Mono', monospace;
        }
        .zman-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .active-zman {
            border-color: #fbce07 !important;
            background: rgba(251, 206, 7, 0.15) !important;
            box-shadow: 0 0 20px rgba(251, 206, 7, 0.2);
        }
        .glow-text {
            text-shadow: 0 0 40px rgba(251, 206, 7, 0.5);
        }
        .glow-red {
            text-shadow: 0 0 60px rgba(239, 68, 68, 0.7);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "d3": "https://esm.sh/d3@^7.9.0",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        // --- CONFIGURATION ---
        const COORDS = { lat: 31.7946, lng: 35.2158 };
        const HEBREW_DAYS = ["יום ראשון", "יום שני", "יום שלישי", "יום רביעי", "יום חמישי", "יום שישי", "שבת"];

        // --- HELPERS ---
        function parseTime(timeStr, baseDate) {
            const [time, period] = timeStr.split(' ');
            let [hours, minutes, seconds] = time.split(':').map(Number);
            if (period === 'PM' && hours !== 12) hours += 12;
            if (period === 'AM' && hours === 12) hours = 0;
            const d = new Date(baseDate);
            d.setHours(hours, minutes, seconds, 0);
            return d;
        }

        function formatTime(d) {
            return d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
        }

        // --- MAIN APP COMPONENT ---
        function App() {
            const [now, setNow] = useState(new Date());
            const [data, setData] = useState(null);
            const [zmanim, setZmanim] = useState([]);
            const [loading, setLoading] = useState(true);

            const fetchData = useCallback(async () => {
                try {
                    const today = new Date();
                    const iso = today.toISOString().split('T')[0];
                    const y = today.getFullYear(), m = today.getMonth() + 1, d = today.getDate();

                    // 1. Zmanim via sunrisesunset.io
                    const solarRes = await fetch(`https://api.sunrisesunset.io/json?lat=${COORDS.lat}&lng=${COORDS.lng}&date=${iso}`).then(r => r.json());
                    
                    // 2. Date hébraïque
                    const hebDateRes = await fetch(`https://www.hebcal.com/converter?cfg=json&gy=${y}&gm=${m}&gd=${d}&g2h=1`).then(r => r.json());
                    
                    // 3. Calendrier Hebcal complet (pour Daf et Parasha)
                    // On demande les événements pour l'année entière pour être sûr d'avoir la parasha de la semaine
                    const hebcalUrl = `https://www.hebcal.com/hebcal?v=1&cfg=json&maj=on&min=on&mod=on&nx=on&year=now&month=now&ss=on&mf=on&c=off&geo=none&F=on&heb=on&s=on`;
                    const dailyRes = await fetch(hebcalUrl).then(r => r.json());

                    const solar = solarRes.results;
                    const items = dailyRes.items || [];
                    
                    // Daf du jour
                    const daf = items.find(i => i.category === 'dafyomi' && i.date === iso)?.hebrew || "לא נמצא";
                    
                    // Parasha de la semaine (la prochaine parasha à partir d'aujourd'hui)
                    const parashaEvent = items.find(i => i.category === 'parashat' && i.date >= iso);
                    const parasha = parashaEvent ? parashaEvent.hebrew : "---";

                    // Calcul des Zmanim (Méthode Gra)
                    const sunrise = parseTime(solar.sunrise, today);
                    const sunset = parseTime(solar.sunset, today);
                    const dawn = parseTime(solar.dawn, today);
                    const dusk = parseTime(solar.dusk, today);
                    const noon = parseTime(solar.solar_noon, today);
                    const shaah = (sunset.getTime() - sunrise.getTime()) / 12;

                    const list = [
                        { id: 'alot', label: 'עלות השחר', fullTime: dawn, time: formatTime(dawn) },
                        { id: 'sunrise', label: 'נץ החמה', fullTime: sunrise, time: formatTime(sunrise) },
                        { id: 'shema', label: 'סוף זמן שמע', fullTime: new Date(sunrise.getTime() + 3 * shaah), time: formatTime(new Date(sunrise.getTime() + 3 * shaah)) },
                        { id: 'tefillah', label: 'סוף זמן תפילה', fullTime: new Date(sunrise.getTime() + 4 * shaah), time: formatTime(new Date(sunrise.getTime() + 4 * shaah)) },
                        { id: 'chatzot', label: 'חצות היום', fullTime: noon, time: formatTime(noon) },
                        { id: 'mincha_g', label: 'מנחה גדולה', fullTime: new Date(noon.getTime() + 0.5 * shaah), time: formatTime(new Date(noon.getTime() + 0.5 * shaah)) },
                        { id: 'plag', label: 'פלג המנחה', fullTime: new Date(sunrise.getTime() + 10.75 * shaah), time: formatTime(new Date(sunrise.getTime() + 10.75 * shaah)) },
                        { id: 'shkia', label: 'שקיעה', fullTime: sunset, time: formatTime(sunset) },
                        { id: 'tzeit', label: 'צאת הכוכבים', fullTime: dusk, time: formatTime(dusk) }
                    ];

                    setData({ hebrewDate: hebDateRes.hebrew, daf, parasha, dateStr: `${d}.${m}.${y}` });
                    setZmanim(list);
                    setLoading(false);
                } catch (e) {
                    console.error("API Error:", e);
                }
            }, []);

            useEffect(() => {
                fetchData();
                const timer = setInterval(() => setNow(new Date()), 1000);
                return () => clearInterval(timer);
            }, [fetchData]);

            const nextZman = useMemo(() => zmanim.find(z => z.fullTime > now) || null, [zmanim, now]);

            const countdown = useMemo(() => {
                if (!nextZman) return null;
                const diff = nextZman.fullTime.getTime() - now.getTime();
                if (diff > 0 && diff <= 1800000) { // 30 minutes
                    const m = Math.floor(diff / 60000);
                    const s = Math.floor((diff % 60000) / 1000);
                    return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                }
                return null;
            }, [nextZman, now]);

            if (loading) return (
                <div className="h-screen flex items-center justify-center bg-black">
                    <div className="text-yellow-400 font-bold text-2xl animate-pulse tracking-widest uppercase">Initialisation...</div>
                </div>
            );

            const curTime = formatTime(now);

            return (
                <div className="h-screen flex flex-col justify-between py-4 px-6 md:px-10">
                    
                    {/* TOP HEADER XXL - AGRANDI */}
                    <header className="flex flex-row-reverse justify-between items-center border-b border-white/10 pb-6">
                        <div className="flex flex-row-reverse items-center gap-8 md:gap-12">
                            <span className="text-yellow-400 digital-font font-bold text-5xl md:text-7xl tracking-tighter">{curTime.slice(0, 5)}</span>
                            <span className="opacity-20 text-4xl hidden md:block">|</span>
                            <div className="flex flex-row-reverse items-baseline gap-4 text-3xl md:text-5xl font-black">
                                <span className="text-blue-400">{HEBREW_DAYS[now.getDay()]}</span>
                                <span className="text-blue-600 text-2xl md:text-4xl whitespace-nowrap">{data.parasha}</span>
                            </div>
                        </div>

                        <div className="flex flex-row-reverse items-center gap-6 md:gap-10 text-2xl md:text-4xl font-black">
                            <span className="text-blue-200 whitespace-nowrap">{data.hebrewDate}</span>
                            <span className="opacity-20 hidden md:block">|</span>
                            <span className="opacity-40 digital-font text-xl md:text-3xl hidden md:block">{data.dateStr}</span>
                            <span className="opacity-20 hidden md:block">|</span>
                            <div className="flex flex-row-reverse items-center gap-3">
                                <span className="opacity-40 text-xl md:text-2xl">דף:</span>
                                <span className="text-green-400 whitespace-nowrap">{data.daf}</span>
                            </div>
                        </div>
                    </header>

                    {/* MAIN DISPLAY */}
                    <main className="flex-grow flex flex-col items-center justify-center relative">
                        {countdown ? (
                            <div className="flex flex-col items-center animate-pulse">
                                <div className="text-red-500 text-3xl md:text-5xl font-black uppercase tracking-[0.4em] mb-4">
                                    {nextZman?.label} בעוד
                                </div>
                                <div className="text-[14rem] md:text-[24rem] leading-none digital-font font-black text-red-500 glow-red">
                                    {countdown}
                                </div>
                                <div className="mt-6 text-3xl md:text-5xl text-white/30 digital-font font-bold uppercase tracking-widest">
                                    HEURE: {curTime}
                                </div>
                            </div>
                        ) : (
                            <div className="text-center">
                                {nextZman && (
                                    <div className="mb-8 md:mb-12">
                                        <div className="text-white/20 uppercase tracking-[0.5em] text-sm md:text-lg font-bold mb-2 md:mb-4">Prochain horaire</div>
                                        <div className="text-5xl md:text-8xl font-black text-white glow-text">{nextZman.label}</div>
                                        <div className="text-3xl md:text-4xl text-yellow-400 mt-2 md:mt-4 digital-font">{nextZman.time.slice(0, 5)}</div>
                                    </div>
                                )}
                                <div className="text-yellow-400/20 text-sm md:text-lg font-bold tracking-[1em] mb-4 md:mb-6">HORAIRE ACTUEL</div>
                                <h1 className="text-[10rem] md:text-[20rem] leading-none font-black digital-font text-white glow-text tracking-tighter">
                                    {curTime}
                                </h1>
                            </div>
                        )}
                    </main>

                    {/* FOOTER ZMANIM STRIP - FLEX WRAP POUR TOUT VOIR */}
                    <footer className="w-full bg-white/5 backdrop-blur-xl rounded-2xl md:rounded-3xl py-4 md:py-8 border border-white/10 mt-auto">
                        <div className="flex flex-row-reverse flex-wrap gap-2 md:gap-4 justify-center px-4">
                            {zmanim.map(z => (
                                <div 
                                    key={z.id} 
                                    className={`zman-card rounded-xl md:rounded-2xl px-4 py-3 md:px-8 md:py-5 flex flex-col items-center min-w-[110px] md:min-w-[180px] flex-grow md:flex-grow-0 ${nextZman?.id === z.id ? 'active-zman' : ''}`}
                                >
                                    <span className="text-[10px] md:text-sm text-white/40 font-black mb-1 md:mb-3 whitespace-nowrap">{z.label}</span>
                                    <span className="text-xl md:text-4xl digital-font font-bold text-white tracking-tight">{z.time.slice(0, 5)}</span>
                                    <span className="text-[8px] md:text-xs digital-font text-white/20 mt-1">{z.time.slice(-2)}</span>
                                </div>
                            ))}
                        </div>
                    </footer>

                    <div className="text-center text-[8px] md:text-[10px] text-white/10 uppercase tracking-[0.6em] mt-4 font-bold">
                        Coordinates: {COORDS.lat}, {COORDS.lng} • Method Gra • Jerusalem Time
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
